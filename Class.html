let currentView = "home";

let currentSubject = null;


function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function stats(){

let total=0;
let completed=0;

data.subjects.forEach(s=>{

s.topics.forEach(t=>{

total++;

if(t.done) completed++;

});

});

return {

total,
completed,
remaining:total-completed,
percent:total
? Math.round(completed/total*100)
:0

};

}


function home(){

currentView="home";

currentSubject=null;

render();

}


function subject(index){

currentView="subject";

currentSubject=index;

render();

}


function render(){

const app =
document.getElementById("app");

if(currentView==="subject"){

renderSubject(app);

}else{

renderHome(app);

}

}


function renderHome(app){

const s=stats();

const subjects =
data.subjects.map((sub,index)=>{

const total=sub.topics.length;

const completed=
sub.topics.filter(t=>t.done).length;

const percent=
total
?Math.round(completed/total*100)
:0;

return `

onclick="subject(${index})"
class="w-full text-left bg-white rounded-2xl p-4 border border-slate-100 shadow-sm mb-2.5">

<div class="flex items-center gap-3">

<div class="w-11 h-11 rounded-xl bg-cyan-50 text-cyan-700 flex items-center justify-center">

</div>

<div class="flex-1 min-w-0">

<h3 class="font-bangla text-sm font-bold text-slate-800 truncate">
${esc(sub.name)}
</h3>

<p class="text-[10px] text-slate-400">
${completed} completed · ${total-completed} remaining
</p>

</div>

<i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>

</div>

<div class="mt-3">

</span>

<div
class="h-full bg-cyan-600 rounded-full"

</div>

</div>

}).join("");

function renderSubject(app){

const s=data.subjects[currentSubject];

if(!s){

home();

return;

}

const total=s.topics.length;

const completed=
s.topics.filter(t=>t.done).length;

const remaining=
total-completed;

const percent=
total
?Math.round(completed/total*100)
:0;


const topics=
s.topics.map((t,i)=>`

<div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm mb-2.5">

<div class="flex gap-3">

<div class="w-9 h-9 rounded-xl ${
t.done
?"bg-emerald-50 text-emerald-600"
:"bg-amber-50 text-amber-600"
} flex items-center justify-center shrink-0">

${t.done
?'<i class="fa-solid fa-check"></i>'
:i+1}

</div>

<div class="flex-1">

<span class="font-bangla text-[9px] font-bold ${
t.done
?"text-emerald-600"
:"text-amber-600"
}">

${t.done?"COMPLETED":"UPCOMING"}

<h3 class="font-bangla text-sm font-bold text-slate-800 mt-1 safe">
${esc(t.name)}
</h3>

<div class="mt-3">

${t.link

<i class="fa-solid fa-play mr-1"></i>

:`

</div>

</div>

</div>

</div>

</div>

`).join("");

<div class="bg-amber-500/10 rounded-xl p-2.5">

</div>

</div>
